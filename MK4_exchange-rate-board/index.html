<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>카드1 — 오늘의 환율 (최소 버전)</title>
<style>
  body{ font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  .value{ font-size: 36px; font-weight: 700; }
  dl{ display:grid; grid-template-columns: 100px 1fr; row-gap:6px; font-size:14px; }
  dt{ color:#666; }
  dd{ margin:0; word-break:break-all; }
</style>
</head>
<body>
  <h1>오늘의 환율</h1>

  <p class="value"><span id="value">불러오는 중…</span> <span id="unit"></span></p>

  <dl>
    <dt>출처</dt><dd id="source">—</dd>
    <dt>출처 URL</dt><dd id="source-url">—</dd>
    <dt>출처 시각</dt><dd id="source-time">—</dd>
    <dt>조회 시각</dt><dd id="fetched-at">—</dd>
    <dt>기준 시간대</dt><dd>Asia/Seoul (KST)</dd>
    <dt>어제 대비</dt><dd id="delta">—</dd>
  </dl>

  <p style="font-size:13px; color:#666; margin-top:14px; margin-bottom:4px;">일별 기록 (기준 시간대: Asia/Seoul, 같은 날짜는 한 건으로 합쳐짐)</p>
  <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
    <thead><tr>
      <th style="text-align:left; border-bottom:1px solid #ddd;">날짜</th>
      <th style="text-align:left; border-bottom:1px solid #ddd;">값</th>
      <th style="text-align:left; border-bottom:1px solid #ddd;">단위</th>
      <th style="text-align:left; border-bottom:1px solid #ddd;">출처 URL</th>
      <th style="text-align:left; border-bottom:1px solid #ddd;">출처 시각</th>
    </tr></thead>
    <tbody id="history-body"></tbody>
  </table>

  <hr style="margin:32px 0;">

  <h1>카드3 — 다섯 가지 실패 (합성 재생)</h1>
  <p style="color:#666; font-size:13.5px;">여기 값은 실제 환율과 무관한 합성 시험값입니다. 위 카드1 값에는 영향을 주지 않습니다.</p>

  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
    <button id="d-reset">① 초기화</button>
    <button data-fx="D1A">② D1-A 재생</button>
    <button data-fx="D1B">③ D1-B 재생</button>
  </div>
  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
    <button data-fx="TIMEOUT">느린 응답</button>
    <button data-fx="AUTH">401 거절</button>
    <button data-fx="RATE">호출 제한</button>
    <button data-fx="OFFLINE">오프라인</button>
    <button data-fx="SCHEMA">응답 형식 변경</button>
  </div>
  <div style="margin-bottom:10px;">
    <button id="d-retry" disabled>다시 시도 (실패 상태에서만 활성화)</button>
  </div>

  <p id="d-status" style="font-family:monospace;">상태: 대기</p>
  <p id="d-stored" style="font-family:monospace;">마지막 정상값: —</p>

  <script>
    'use strict';

    // 카드1에서 다루는 값 하나. signal_id, unit, source_url은
    // 정규화 스키마(normalized-reading.schema.json)가 요구하는 이름 그대로 씁니다.
    const API_URL = 'https://api.frankfurter.dev/v1/latest?base=USD&symbols=KRW';

    // 카드4: "저장값"을 변수 하나가 아니라 일별 기록 배열로 바꿉니다.
    // 같은 record_date면 덮어쓰고, 다른 record_date면 새로 추가하는
    // upsertDaily()를 만들어 씁니다 (카드3의 dedup 로직과 같은 규칙).
    const LIVE_KEY = 't04_live_state_v1';
    let liveState = JSON.parse(localStorage.getItem(LIVE_KEY) || 'null') || { daily_readings: [] };

    // 카드5: 가장 최근 두 날짜를 조회 날짜순으로 놓고 변화값을 다시 계산합니다.
    // 저장된 daily_readings에서 다시 계산하므로, 화면에 보이는 값과
    // 나중에 누구든 같은 규칙으로 재계산한 값이 항상 같습니다 (T04-C24).
    function computeDelta(rows){
      if (rows.length < 2) return null; // 아직 비교할 이전 날짜가 없음
      const sorted = [...rows].sort((a,b) => a.record_date.localeCompare(b.record_date));
      const [prev, curr] = sorted.slice(-2);
      if (prev.unit !== curr.unit) return null; // 단위가 다르면 비교 불가
      return { delta: curr.normalized_value - prev.normalized_value, prev, curr };
    }

    function upsertDaily(state, reading){
      const idx = state.daily_readings.findIndex(
        r => r.signal_id === reading.signal_id && r.record_date === reading.record_date
      );
      if (idx >= 0) state.daily_readings[idx] = reading;   // 같은 날짜 → 덮어쓰기 (T04-C20)
      else state.daily_readings.push(reading);              // 다른 날짜 → 새 행 (T04-C21)
      state.daily_readings.sort((a,b) => a.record_date.localeCompare(b.record_date));
      localStorage.setItem(LIVE_KEY, JSON.stringify(state));
      return state;
    }

    function kstDate(isoString){
      const date = new Date(isoString);
      const parts = new Intl.DateTimeFormat('en', {
        timeZone: 'Asia/Seoul', year:'numeric', month:'2-digit', day:'2-digit'
      }).formatToParts(date);
      const byType = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${byType.year}-${byType.month}-${byType.day}`;
    }

    function kstTimeLabel(isoString){
      const date = new Date(isoString);
      const parts = new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul', hour:'2-digit', minute:'2-digit', second:'2-digit',
        year:'numeric', month:'2-digit', day:'2-digit', hour12:false
      }).formatToParts(date);
      const byType = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${byType.year}-${byType.month}-${byType.day} ${byType.hour}:${byType.minute}:${byType.second} KST`;
    }

    async function fetchOnce(){
      const fetchedAt = new Date().toISOString();
      const res = await fetch(API_URL);
      const data = await res.json();

      // 원자료(data.rates.KRW, data.date)를 정규화된 형태로 바꿉니다.
      const reading = {
        signal_id: 'usd-krw-fx-rate',
        normalized_value: data.rates.KRW,
        unit: 'KRW per USD',
        source_name: 'Frankfurter (ECB 기준환율)',
        source_url: API_URL,
        source_time: `${data.date}T00:00:00.000Z`,
        fetched_at: fetchedAt,
        record_timezone: 'Asia/Seoul',
        record_date: kstDate(fetchedAt)
      };

      // 저장: 오늘 날짜 키로 upsert. 원자료 → 저장 → 화면이 같은 reading에서 나오므로
      // 여전히 셋이 어긋날 수 없습니다 (T04-C10).
      liveState = upsertDaily(liveState, reading);
      render(reading);
    }

    function render(reading){
      document.getElementById('value').textContent = reading.normalized_value.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
      document.getElementById('unit').textContent = reading.unit;
      document.getElementById('source').textContent = reading.source_name;
      document.getElementById('source-url').textContent = reading.source_url;
      document.getElementById('source-time').textContent = kstTimeLabel(reading.source_time);
      document.getElementById('fetched-at').textContent = kstTimeLabel(reading.fetched_at);

      const body = document.getElementById('history-body');
      body.innerHTML = liveState.daily_readings.map(r =>
        `<tr><td>${r.record_date}</td><td>${r.normalized_value}</td><td>${r.unit}</td>` +
        `<td style="word-break:break-all;">${r.source_url}</td><td>${kstTimeLabel(r.source_time)}</td></tr>`
      ).join('');

      const cmp = computeDelta(liveState.daily_readings);
      const deltaEl = document.getElementById('delta');
      if (!cmp){
        deltaEl.textContent = '아직 비교할 이전 날짜 기록이 없습니다 (내일 다시 열면 계산됩니다)';
      } else {
        const sign = cmp.delta > 0 ? '+' : '';
        deltaEl.textContent = `${cmp.prev.record_date} → ${cmp.curr.record_date} : ${sign}${cmp.delta.toFixed(2)} ${cmp.curr.unit}`;
      }
    }

    fetchOnce();

    /* =====================================================================
     * 카드3 — 다섯 가지 실패
     * adapter-reset.example.js(공개 fixture 꾸러미)의 로직을 브라우저용으로
     * 그대로 옮깁니다. 카드1의 storedReading과는 별도의 상태를 씁니다.
     * ===================================================================== */

    const ERROR_CODES = ['timeout', 'auth', 'rate_limit', 'offline', 'schema_error'];

    function clone(v){ return JSON.parse(JSON.stringify(v)); }

    function resetEvaluationState(){
      return {
        daily_readings: [],
        current_reading: null,
        status: null,       // { freshness: 'fresh'|'stale', error_code: ... }
        last_delta: null,
        last_run: null
      };
    }

    // 정상 응답 처리: 원자료를 검증하고 일별 행으로 저장한다.
    function applySuccessfulReading(state, reading, meta = {}){
      const s = clone(state);
      const existingIndex = s.daily_readings.findIndex(
        r => r.signal_id === reading.signal_id && r.record_date === reading.record_date
      );
      const row = { signal_id: reading.signal_id, record_date: reading.record_date,
        normalized_value: reading.normalized_value, unit: reading.unit, reading: clone(reading) };
      if (existingIndex >= 0) s.daily_readings[existingIndex] = row;
      else s.daily_readings.push(row);
      s.daily_readings.sort((a,b) => a.record_date.localeCompare(b.record_date));

      s.current_reading = clone(reading);
      s.status = { freshness: 'fresh', error_code: 'none' };
      s.last_run = { fixture_id: meta.fixture_id || null, outcome: 'success' };
      return s;
    }

    // 실패 처리: 마지막 정상값(daily_readings)은 절대 건드리지 않고,
    // status만 stale/해당 error_code로 바꾼다. → T04-C17, T04-C18
    function applyError(state, errorCode, meta = {}){
      const s = clone(state);
      s.status = { freshness: 'stale', error_code: errorCode };
      s.last_run = { fixture_id: meta.fixture_id || null, outcome: 'error', error_code: errorCode };
      return s;
    }

    // fixture 하나를 재생해서 성공/실패로 분기한다.
    function runFixture(state, fixture){
      const meta = { fixture_id: fixture.fixture_id };
      if (fixture.transport.mode === 'timeout') return applyError(state, 'timeout', meta);
      if (fixture.transport.mode === 'offline') return applyError(state, 'offline', meta);
      if (fixture.transport.status === 401 || fixture.transport.status === 403) return applyError(state, 'auth', meta);
      if (fixture.transport.status === 429) return applyError(state, 'rate_limit', meta);
      if (fixture.transport.status >= 200 && fixture.transport.status < 300){
        try { return applySuccessfulReading(state, fixture.payload, meta); }
        catch { return applyError(state, 'schema_error', meta); }
      }
      return applyError(state, 'schema_error', meta);
    }

    // 공개 fixture 꾸러미에서 그대로 가져온 값 (README의 재생 순서와 동일)
    const FIXTURES = {
      D1A: { fixture_id:'T04-NORMAL-D1-A', transport:{ mode:'http', status:200 },
        payload:{ signal_id:'aleph-demo-index', normalized_value:100, unit:'pt',
          record_date:'2026-08-24' } },
      D1B: { fixture_id:'T04-NORMAL-D1-B', transport:{ mode:'http', status:200 },
        payload:{ signal_id:'aleph-demo-index', normalized_value:105, unit:'pt',
          record_date:'2026-08-24' } },
      TIMEOUT: { fixture_id:'T04-TIMEOUT', transport:{ mode:'timeout', status:null } },
      AUTH:    { fixture_id:'T04-AUTH-401', transport:{ mode:'http', status:401 } },
      RATE:    { fixture_id:'T04-RATE-429', transport:{ mode:'http', status:429 } },
      OFFLINE: { fixture_id:'T04-OFFLINE', transport:{ mode:'offline', status:null } },
      SCHEMA:  { fixture_id:'T04-SCHEMA-BREAK', transport:{ mode:'http', status:200 },
        payload:{ signal_id:'aleph-demo-index', normalized_value:'105', unit:'pt', // 문자열! → 검증 실패 유도
          record_date:'2026-08-24' } },
      RECOVER: { fixture_id:'T04-RECOVER-D2', transport:{ mode:'http', status:200 },
        payload:{ signal_id:'aleph-demo-index', normalized_value:120, unit:'pt',
          record_date:'2026-08-25' } }
    };

    // 지금 단계는 정규화 스키마 검증을 아직 안 붙였으므로,
    // SCHEMA 픽스처가 실패로 처리되도록 최소한의 타입 체크만 넣습니다.
    function applySuccessfulReading(state, reading, meta = {}){
      if (typeof reading.normalized_value !== 'number') {
        throw new TypeError('normalized_value must be a number');
      }
      const s = clone(state);
      const existingIndex = s.daily_readings.findIndex(
        r => r.signal_id === reading.signal_id && r.record_date === reading.record_date
      );
      const row = { signal_id: reading.signal_id, record_date: reading.record_date,
        normalized_value: reading.normalized_value, unit: reading.unit, reading: clone(reading) };
      if (existingIndex >= 0) s.daily_readings[existingIndex] = row;
      else s.daily_readings.push(row);
      s.daily_readings.sort((a,b) => a.record_date.localeCompare(b.record_date));

      s.current_reading = clone(reading);
      s.status = { freshness: 'fresh', error_code: 'none' };
      s.last_run = { fixture_id: meta.fixture_id || null, outcome: 'success' };
      return s;
    }

    let demoState = resetEvaluationState();

    function renderDemo(){
      const badge = document.getElementById('d-status');
      const stored = document.getElementById('d-stored');
      const retryBtn = document.getElementById('d-retry');

      if (!demoState.status){
        badge.textContent = '상태: 대기';
        retryBtn.disabled = true;
      } else {
        badge.textContent = `상태: ${demoState.status.freshness} / ${demoState.status.error_code}`;
        retryBtn.disabled = demoState.status.freshness !== 'stale';
      }
      const last = demoState.daily_readings[demoState.daily_readings.length - 1];
      stored.textContent = '마지막 정상값: ' + (last ? `${last.normalized_value} (${last.record_date})` : '—');
    }

    document.getElementById('d-reset').addEventListener('click', () => {
      demoState = resetEvaluationState();
      renderDemo();
    });
    document.querySelectorAll('[data-fx]').forEach(btn => {
      btn.addEventListener('click', () => {
        demoState = runFixture(demoState, FIXTURES[btn.dataset.fx]);
        renderDemo();
      });
    });
    document.getElementById('d-retry').addEventListener('click', () => {
      demoState = runFixture(demoState, FIXTURES.RECOVER);
      renderDemo();
    });

    renderDemo();
  </script>
</body>
</html>
